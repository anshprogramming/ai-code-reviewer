name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install groq PyGithub

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python << 'EOF'
          import os, subprocess
          from groq import Groq
          from github import Github
          
          groq = Groq(api_key=os.getenv("GROQ_API_KEY"))
          gh = Github(os.getenv("GITHUB_TOKEN"))
          
          # Get diff
          subprocess.run(["git", "fetch", "origin", f"pull/{os.getenv('PR')}/head:pr"], check=True)
          diff = subprocess.run(["git", "diff", "origin/main...pr"], capture_output=True, text=True).stdout[:10000]
          
          if not diff.strip():
              print("No changes")
              exit(0)
          
          # AI Review
          response = groq.chat.completions.create(
              model="llama3-70b-8192",
              messages=[
                  {"role": "system", "content": "You are a code reviewer. Find security issues, performance problems, and code quality issues. Be concise. Format: **Issue**: description, **Fix**: suggestion"},
                  {"role": "user", "content": f"Review this diff:\n```diff\n{diff}\n```"}
              ],
              temperature=0.2
          )
          
          # Post comment
          repo = gh.get_repo(os.getenv("REPO"))
          pr = repo.get_pull(int(os.getenv("PR")))
          pr.create_issue_comment(f"## 🤖 AI Review\n\n{response.choices[0].message.content}")
          print("✅ Done!")
          EOF
